apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collabspace
  template:
    metadata:
      labels:
        app: collabspace
    spec:
      containers:
        - name: collabspace
          image: collabspace:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: collabspace
spec:
  selector:
    app: collabspace
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
